<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  STOA LINUX — EB Garamond from texlive-fontsextra.

  The Stoa theme (GTK, zathura, calibre, the wallpapers) asks for "EB Garamond".
  Arch's official repos have no standalone package for it, but texlive-fontsextra
  ships the full family (Regular … ExtraBold, italics, Initials) under texmf —
  a tree fontconfig does not scan, so `fc-list` never saw it.

  This adds only that one directory: nothing is copied, and the other few
  hundred TeX fonts stay out of every font picker. A missing directory is
  ignored, so it is harmless where texlive-fontsextra is not installed; there
  setup/post-install.sh falls back to the AUR package otf-eb-garamond.
-->
<fontconfig>
  <dir>/usr/share/texmf-dist/fonts/opentype/public/ebgaramond</dir>
</fontconfig>
