#  ╔══════════════════════════════════════════════════════════════╗
#  ║  STOA LINUX — Noctalia v5 shell config                       ║
#  ║  "Know thyself." — inscribed at Delphi                       ║
#  ╚══════════════════════════════════════════════════════════════╝
#
#  Noctalia reads every *.toml in ~/.config/noctalia/, merges them
#  alphabetically, and hot-reloads on change. GUI edits land in
#  ~/.local/state/noctalia/settings.toml and win over this file — so if a
#  setting here seems ignored, check there first.
#
#  The v4 leftovers in this directory (settings.json, plugins.json,
#  colorschemes/) are inert: v5 only reads *.toml and palettes/.

[shell]
font_family           = "EB Garamond"   # from texlive-fontsextra, see config/fontconfig
time_format           = "{:%H:%M}"
date_format           = "%A, %d/%m"
polkit_agent          = true          # replaces hyprpolkitagent
clipboard_enabled     = true          # replaces cliphist and the old stoa-clipboard
clipboard_history_max_entries = 200
offline_mode          = false
telemetry_enabled     = false
settings_show_advanced = true
settings_window_translucent = true
niri_overview_type_to_launch_enabled = true
password_style        = "random"
# telemetry_enabled stays false on purpose. The GUI wrote `true` into
# settings.toml on its first save, and that wins over this: turn it off in
# the Noctalia settings, or delete the key from settings.toml.

[shell.animation]
enabled = true
speed   = 1.0

[shell.panel]
transparency_mode        = "glass"
borders                  = false
shadow                   = true
launcher_placement       = "attached"
launcher_position        = "center"
clipboard_placement      = "attached"
clipboard_position       = "center"
control_center_placement = "attached"
session_placement        = "floating"
session_position         = "center"
open_near_click_launcher       = true
open_near_click_clipboard      = true
open_near_click_control_center = true
open_near_click_wallpaper      = true

[shell.screenshot]
annotate             = true
confirm_region       = true
remember_last_region = true
save_to_file         = false
show_cursor          = true

[shell.session]
grid           = true
show_shortcuts = false

# Push wallpaper, palette, theme mode, font and monitor layout to the
# Noctalia greeter whenever they change, so the login screen and the
# session stay visually identical without a second copy of the palette.
#
# Deliberately NOT writing an [appearance.palette] into the greeter's own
# greeter.toml: upstream documents that a declarative greeter.toml is never
# overwritten by Sync and WINS over it, so pinning colours there would
# permanently shadow this and freeze the login screen on whatever the
# palette happened to be that day.
#
# Sync escalates through pkexec/run0 to write /var/lib/noctalia-greeter,
# and that escalation is a polkit password prompt every single time. With
# auto_sync on it fires on every change it watches — including each
# wallpaper rotation, so turning on [wallpaper.automation] turns on a
# password box every interval_seconds. The login screen does not need to
# follow a rotating wallpaper, and the palette changes rarely, so the sync
# is on demand: `noctalia msg greeter-sync`, or Settings -> Security ->
# Noctalia Greeter -> Sync Now, after changing the theme.

[shell.greeter_sync]
# Keep this false while [wallpaper.automation] is on: every rotation would
# raise the polkit password box described above. A GUI save can write
# `auto_sync = true` into settings.toml and silently undo it.
auto_sync = false

[shell.launcher]
categories    = true
show_icons    = true
sort_by_usage = true
app_grid      = true
category_icons_only = true
default_view  = "pinned"
search_position = "top"
show_app_actions = true
show_session_button  = false
show_settings_button = false
pinned = [
    "brave-browser", "steam", "eu.betterbird.Betterbird",
    "onlyoffice-desktopeditors", "obsidian", "calibre-gui", "kitty",
    "thunar", "enpass", "stoa-snapshots", "dfm", "dev.zed.Zed",
    "qalculate-gtk",
]

[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = true

[shell.launcher.providers.wallpaper]
prefix = "wall"
global = true

[shell.launcher.providers.windows]
prefix = "win"
global = true

# ── Theme ─────────────────────────────────────────────────────────────
# The Stoa palette carries over from the v4 colorscheme unchanged —
# same mPrimary/mSurface/... key names, same terminal block.
# See palettes/Stoa.json.

[theme]
mode           = "dark"
source         = "custom"
custom_palette = "Stoa"
pure_black_dark = false
wallpaper_scheme = "m3-content"

# Off: Stoa writes the apps' themes itself (Super+S -> Theme), and kitty.conf
# no longer includes the themes/noctalia.conf these templates used to generate.
[theme.templates]
enable_builtin_templates   = false
enable_community_templates = false

# ── Wallpaper ─────────────────────────────────────────────────────────
# Replaces swaybg. stoa-walls.sh still curates the collection; Noctalia
# owns setting and rotating it.

[wallpaper]
enabled             = true
fill_mode           = "fit"
transition          = ["diamond", "disc", "fade", "honeycomb", "melt", "pixel", "stripes", "vortex", "wipe", "zoom"]
transition_duration = 3700
transition_on_startup = true
edge_smoothness     = 1.0
directory           = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled          = true
interval_seconds = 1800
order            = "random"
recursive        = true

# ── Notifications ─────────────────────────────────────────────────────
# Replaces the standalone notification daemon.

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
background_opacity = 0.97
offset_x           = 20
offset_y           = 8

# ── OSD ───────────────────────────────────────────────────────────────
# Replaces stoa-osd.sh (volume/brightness popups).

[osd]
position           = "top_center"
orientation        = "horizontal"
background_opacity = 0.97
offset_y           = 8

[osd.kinds]
volume       = true
brightness   = true
wifi         = true
bluetooth    = true
caffeine     = true
nightlight   = true
dnd          = true
privacy      = true

# ── Lock screen ───────────────────────────────────────────────────────
# Replaces hyprlock.

[lockscreen]
enabled         = true
blurred_desktop = true
blur_intensity  = 0.5
tint_intensity  = 0.3

# ── Idle ──────────────────────────────────────────────────────────────
# Replaces stoa-screensaver.sh / hypridle.

[idle.behavior.lock]
enabled = true
timeout = 600
action  = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 900
action  = "screen_off"

# ── System monitor ────────────────────────────────────────────────────

[system.monitor]
enabled = true

# ── Bar ───────────────────────────────────────────────────────────────
# A transparent, floating bar (background_opacity 0) whose widgets sit in
# capsules:
#   left   sysmon, weather, health pill, media
#   center clock, taskbar, launcher, workspaces, screen-toolkit widget
#   right  tray, notifications, clipboard, drive pill, a capsule group
#          (network, bluetooth, volume, brightness, battery), the keybinds
#          pill, session
#
# waybar spent four modules on disk/cpu/memory/network; v5 folds all of
# that into the single `sysmon` widget, driven by [system.monitor] above.
#
# The section MUST be [bar.default]. `default` is the name of the built-in
# bar (BarConfig::name in config_types.h), and Noctalia only falls back to
# a built-in bar when no [bar.*] is defined at all — it does not merge a
# differently named section into it. Calling this [bar.main] created a
# SECOND bar alongside the built-in one, so the shell drew two stacked
# bars: the one customised through the Settings GUI (which writes
# [bar.default] into ~/.local/state/noctalia/settings.toml) plus this one.

[bar.default]
position           = "top"
thickness          = 40
background_opacity = 0.0
radius             = 12
margin_ends        = 15
margin_edge        = 10
padding            = 0
widget_spacing     = 6
shadow             = true
reserve_space      = true
layer              = "overlay"
scale              = 1.05
font_family        = "EB Garamond"
font_scale         = 1.2
font_weight        = 600
contact_shadow     = true
capsule            = true
capsule_fill       = "on_primary"
capsule_foreground = "primary"
capsule_border     = "on_primary"
capsule_border_width = 0.0
capsule_opacity    = 0.66

start  = ["sysmon", "weather", "stoa/health:pill", "media"]
center = ["clock", "taskbar", "launcher", "workspaces", "widget"]
# `stoa/drive:pill`, `stoa/health:pill` and `stoa/keybinds:pill` are the local
# plugins in theme/noctalia-plugins/{stoa-drive,stoa-health,stoa-keybinds}
# (plugin widgets are addressed as <plugin-id>:<entry-id>).
# `group:g1` is the capsule group below; `pill` is [widget.pill].
end    = ["tray", "notifications", "clipboard", "stoa/drive:pill", "group:g1", "pill", "session"]

[bar.default.dead_zone.actions]
middle      = "volume-mute"
scroll_up   = "volume-up 1"
scroll_down = "volume-down 1"

[[bar.default.capsule_group]]
id        = "g1"
members   = ["network", "bluetooth", "volume", "brightness", "battery"]
enabled   = true
accordion = false
accordion_direction = "end"
fill      = "on_primary"
foreground = "primary"
border    = "on_primary"
border_width = 1.0
opacity   = 1.0
padding   = 6.0

# Bar widgets configured beyond their defaults.
[widget.pill]
type = "stoa/keybinds:pill"

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.launcher]
glyph = "columns"
capsule_foreground = "primary"

[widget.lock_keys]
hide_when_off = true
show_scroll_lock = true

[widget.media]
rotate_album_art = true
title_scroll = "always"

[widget.tray]
match_adjacent_spacing = true

[widget.weather]
max_length = 180

# ── Dock, night light and friends ─────────────────────────────────────

[accessibility]
ui_scale = 1.05

[backdrop]
enabled = true

[brightness]
sync_all_monitors = true

[calendar]
enabled = true
dedupe_events = true

[dock]
enabled          = true
layer            = "overlay"
background_opacity = 0.0
pinned           = ["brave-browser"]
reserve_space    = false
show_dots        = true
smart_auto_hide  = true

[nightlight]
enabled           = true
temperature_day   = 4800
temperature_night = 2800

[control_center]
width           = 800
sidebar_section = "none"

[control_center.calendar]
show_week_numbers = true

# ── Control centre shortcuts ──────────────────────────────────────────

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "session"

# ── Hooks ─────────────────────────────────────────────────────────────
# `started` fires once the shell is actually up. Hyprland used to run
# stoa-doctor behind a `sleep 3`, guessing at how long the bar takes to
# render so the health pills would not race their data producer. The hook
# removes the guess: the doctor runs when there is a shell to report into.
#
# Deliberately NOT set: colors_changed. Palette changes do happen at
# runtime — Super+S → Theme → Color Palette writes StoaCustom.json and
# repoints custom_palette below — but that path already rewrites every
# app's config itself and reloads Hyprland and Kitty, so a hook firing on
# top of it would have nothing left to do.

[hooks]
started = "~/.local/bin/stoa-doctor"

# ── Plugins ───────────────────────────────────────────────────────────
# Stoa's local plugins live in theme/noctalia-plugins/ and are symlinked
# into ~/.local/share/noctalia/plugins by install.sh:
#   stoa/drive, stoa/health,  bar pills (see [bar.default] above)
#   stoa/keybinds
#   stoa/memento              Memento Mori desktop widget (below)
#   stoa/predict              text-prediction popup (Super+Shift+S)
# alexander/screen-toolkit comes from the built-in community source: screen
# recording, OCR, colour picker — Shift+Print opens it.
#
# Installed is not enabled, so they are listed here. A [plugins].enabled
# in settings.toml (the GUI writes one the first time a plugin is toggled)
# replaces this list rather than adding to it; install.sh enables the same
# plugins over IPC so an existing install picks up new ones too.

[plugin_settings."stoa/drive"]
manage_open_near_click = true

[plugin_settings."stoa/health"]
manage_open_near_click = true

[plugin_settings."stoa/keybinds"]
cheatsheet_open_near_click = true
icon = "keyboard-hide"

[plugin_settings."stoa/predict"]
popup_placement = "attached"

[plugin_settings."alexander/screen-toolkit"]
panel-mode = "legacy"
panel_placement = "attached"
panel_open_near_click = true
panel-legacy_layer = "overlay"
panel-legacy_open_near_click = true
panel-legacy_position = "auto"
result_layer = "overlay"
record-copy-to-clipboard = true
search-engine-url = "https://search.brave.com/search?q="
selected-ocr-lang = "eng+pt-br"

[plugins]
enabled = ["stoa/drive", "stoa/health", "stoa/keybinds", "stoa/memento", "stoa/predict", "alexander/screen-toolkit"]

# ── Desktop widgets ───────────────────────────────────────────────────
# One Memento Mori tile. No `output`: Noctalia puts it on the focused
# monitor and clamps cx/cy to that monitor's bounds. Move or resize it with
# `noctalia msg desktop-widgets-edit`; the editor saves the new layout to
# settings.toml, which then wins over this.

[desktop_widgets]
enabled = true

[desktop_widgets.widget.stoa_memento]
type = "stoa/memento:desktop"
cx   = 1640.0
cy   = 360.0
