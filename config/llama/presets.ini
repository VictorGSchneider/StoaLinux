; Presets do llama serve (modo router). Chaves = flags sem os "--".
; Seções = ids dos modelos em ~/Models/llm. [*] vale para todos.
; Com --fit (padrão), o llama ajusta camadas na GPU e contexto para caber na VRAM (6 GB).
