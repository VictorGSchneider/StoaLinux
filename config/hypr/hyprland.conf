# ╔══════════════════════════════════════════════════════════════╗
# ║  STOA LINUX — Hyprland                                     ║
# ║  "Order is the first law of heaven." — Marcus Aurelius      ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Monitor ──
monitor = , preferred, auto, 1

# ── Environment Variables ──
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Colloid-cursors
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_STYLE_OVERRIDE, Fusion
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = GTK_THEME, Adwaita:dark
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# ── Input ──
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true

    touchpad {
        natural_scroll = true
    }
}

# ── Stoic Palette ──
$bg         = rgb(211e19)
$bg_light   = rgb(2d2921)
$fg         = rgb(d4cfc4)
$fg_dim     = rgb(a89f91)
$bronze     = rgb(c49a5c)
$gold       = rgb(d4a84b)
$olive      = rgb(8a9a6c)
$terracotta = rgb(b36b5a)
$stone      = rgb(6e6a62)

# ── Appearance ──
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2

    col.active_border = $bronze
    col.inactive_border = $bg_light

    layout = dwindle
}

decoration {
    rounding = 4

    blur {
        enabled = true
        size = 4
        passes = 2
    }

    shadow {
        enabled = true
        range = 12
        offset = -7 -7
        render_power = 3
        color = rgba(0a090880)
    }

    inactive_opacity = 0.90
    active_opacity = 1.0
}

animations {
    enabled = true
    bezier = stoa, 0.25, 0.8, 0.25, 1.0

    animation = windows, 1, 4, stoa
    animation = windowsOut, 1, 4, stoa, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, stoa
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Keybinds ──
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Space, exec, qs -c noctalia-shell ipc call launcher toggle
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod CTRL, E, exit
bind = $mod CTRL, R, exec, ~/.local/bin/stoa-bar-toggle

# Alt+Tab — hyprswitch visual switcher (thumbnails, grouped by workspace).
# Hold Alt and tap Tab to cycle through every window across all workspaces;
# release Alt to focus. Alt+Shift+Tab cycles backwards. The daemon is
# started in the Autostart section below.
bind = ALT, Tab, exec, hyprswitch gui --mod-key alt --key tab --max-switch-offset 9 --hide-active-window-border
bind = ALT SHIFT, Tab, exec, hyprswitch gui --mod-key alt --key tab --max-switch-offset 9 --hide-active-window-border -r

# ── Apps ──
bind = $mod, A, exec, ~/.local/bin/stoa-store
bind = $mod, B, exec, brave --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mod, C, exec, qalculate-gtk
bind = $mod+SHIFT, E, exec, kitty -e lf
bind = $mod, E, exec, thunar
bind = $mod, N, exec, kitty -e btop
bind = $mod, O, exec, obsidian
bind = $mod, S, exec, ~/.local/bin/stoa-settings
bind = $mod, W, exec, ~/.local/bin/stoa-winapps
bind = $mod, G, exec, dfm
bind = $mod, slash, exec, ~/.local/bin/stoa-keybinds-toggle

# ── Lock Screen ──
bind = $mod, Escape, exec, hyprlock

# ── Navigation (vim) ──
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── Resize ──
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -20 0
binde = , J, resizeactive, 0 20
binde = , K, resizeactive, 0 -20
binde = , L, resizeactive, 20 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# ── Workspaces (I to X) ──
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ── Mouse ──
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Volume ──
binde = , XF86AudioRaiseVolume, exec, ~/.local/bin/stoa-osd volume-up
binde = , XF86AudioLowerVolume, exec, ~/.local/bin/stoa-osd volume-down
bind  = , XF86AudioMute, exec, ~/.local/bin/stoa-osd volume-mute

# ── Brightness ──
binde = , XF86MonBrightnessUp, exec, ~/.local/bin/stoa-osd brightness-up
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/stoa-osd brightness-down

# ── Display toggle (laptop / extend / mirror) ──
# XF86Display = Fn+F7 on most Acer/ASUS laptops (when the EC routes it
# through the i8042 keyboard). Super+P is the Win+P-style fallback
# for laptops whose Fn key is dead in Linux.
bind = , XF86Display, exec, ~/.local/bin/stoa-display
bind = $mod, P, exec, ~/.local/bin/stoa-display

# ── CapsLock / NumLock ──
# Noctalia's LockKeys widget shows current state in the bar and its
# OSD module fires on lock-state changes — no WM-level binding needed.

# ── Capture (screenshot + recording) ──
bind = , Print, exec, ~/.local/bin/stoa-capture

# ── Clipboard ──
bind = $mod, V, exec, ~/.local/bin/stoa-clipboard show
bind = $mod SHIFT, V, exec, ~/.local/bin/stoa-clipboard pin
bind = $mod SHIFT, B, exec, ~/.local/bin/stoa-clipboard clear

# ── Stoatools ──
bind = $mod SHIFT, T, exec, ~/.local/bin/stoa-ocr
bind = $mod SHIFT, P, exec, ~/.local/bin/stoa-paste
bind = $mod SHIFT, S, exec, ~/.local/bin/stoa-predict toggle

# ── Rules ──
windowrule = opacity 1.0 override 1.0 override, match:class ^(brave-browser)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(firefox)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(mpv)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(imv)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(zathura)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(obsidian)$

# ── Qalculate ──
windowrule = float on, match:class ^(qalculate-gtk)$
windowrule = size 420 540, match:class ^(qalculate-gtk)$
windowrule = center on, match:class ^(qalculate-gtk)$

# ── Steam ──
windowrule = opacity 1.0 override 1.0 override, match:class ^(steam)$
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List)$
windowrule = float on, match:class ^(steam)$, match:title ^(Steam Settings)$
windowrule = workspace 9 silent, match:class ^(steam)$, match:title ^(Steam)$

# ── Calibre (eBooks) ──
windowrule = opacity 1.0 override 1.0 override, match:class ^(calibre)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(calibre-ebook-viewer)$

# ── YACReader (Comics) ──
windowrule = opacity 1.0 override 1.0 override, match:class ^(YACReader)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(YACReaderLibrary)$

# ── Autostart ──
# Hyprlock first — when the session is launched via autologin on tty1
# (see setup/enable-stoa-greeter.sh) this turns hyprlock into the boot
# login screen. Outside that flow it just locks immediately on session
# start, which is harmless.
exec-once = hyprlock
exec-once = ~/.local/bin/stoa-bar
# hyprswitch daemon — backs the Alt+Tab visual window switcher.
# --show-title shows window titles; --workspaces-per-row groups the
# preview grid by workspace; --size-factor scales the thumbnails.
exec-once = hyprswitch init --show-title --workspaces-per-row 5 --size-factor 5.5 &
exec-once = swaybg -i ~/.config/stoa/wallpapers/marble.png -m fill
# Noctalia Shell owns notifications via org.freedesktop.Notifications.
# Scripts call notify-send; toasts land in Noctalia's notification panel.
exec-once = wl-paste --watch cliphist store
exec-once = /home/zeno/StoaLinux/scripts/stoa-quotes-sync tick
exec-once = ~/.local/bin/stoa-drive mount-all
exec-once = /home/zeno/StoaLinux/scripts/stoa-doctor
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


# >>> stoa-gpu-setup: env (auto-managed) >>>
# Hybrid laptop (amd iGPU + NVIDIA dGPU, muxless HDMI):
# List BOTH cards — NVIDIA first so the dGPU is the primary KMS
# device (HDMI on the dGPU port lights up), iGPU second so the
# laptop's eDP panel (wired to the iGPU) is also enumerated.
env = AQ_DRM_DEVICES, /dev/dri/nvidia-card:/dev/dri/igpu-card
env = WLR_DRM_DEVICES, /dev/dri/nvidia-card:/dev/dri/igpu-card
env = __NV_PRIME_RENDER_OFFLOAD, 1
env = __VK_LAYER_NV_optimus, NVIDIA_only
env = LIBVA_DRIVER_NAME, radeonsi
env = WLR_NO_HARDWARE_CURSORS, 1
env = __GL_GSYNC_ALLOWED, 1
env = __GL_VRR_ALLOWED, 1
# <<< stoa-gpu-setup: env (auto-managed) <<<
