# ╔══════════════════════════════════════════════════════════════╗
# ║  STOA LINUX — Hyprlock                                     ║
# ║  "Memento Mori — remember you must die."                    ║
# ╚══════════════════════════════════════════════════════════════╝

general {
    hide_cursor = true
    # grace=0: hyprlock doubles as the Stoa boot greeter (see setup/enable-stoa-greeter.sh).
    # A non-zero grace would let any keypress in the first N seconds bypass the password.
    grace = 0
}

# ── Background (blurred wallpaper) ──
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.1
}

# ── Clock ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(196, 154, 92, 1.0)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 160
    halign = center
    valign = center
}

# ── Date ──
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(212, 207, 196, 0.8)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

# ── Stoic Quote ──
label {
    monitor =
    text = cmd[update:0] echo "$(stoa-quotes-sync next 2>/dev/null || echo 'The happiness of your life depends upon the quality of your thoughts. — Marcus Aurelius')"
    color = rgba(212, 207, 196, 0.5)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, -140
    halign = center
    valign = center
}

# ── Password Input ──
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(196, 154, 92, 0.6)
    inner_color = rgba(33, 30, 25, 0.9)
    font_color = rgba(212, 207, 196, 1.0)
    fade_on_empty = true
    placeholder_text = <span foreground="##a89f91">Ι  Password</span>
    hide_input = false
    check_color = rgba(138, 154, 108, 1.0)
    fail_color = rgba(179, 107, 90, 1.0)
    fail_text = <span foreground="##b36b5a">$FAIL</span>
    position = 0, -20
    halign = center
    valign = center
    rounding = 4
}

# ── Username ──
label {
    monitor =
    text = $USER
    color = rgba(110, 106, 98, 0.8)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = center
}
