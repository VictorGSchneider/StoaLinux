# Modelos do LocalAI (--models-config-file). Caminhos relativos a --models-path (~/Models).
# Contexto 32768 nos modelos de chat: o chat do LocalAI anexa ~14 ferramentas (~13k tokens).
# KV em q8_0 para caber nos 6 GB. Texto: GGUFs de ~/Models/llm (llama.cpp). Imagem: checkpoints SDXL de ~/Models (stable-diffusion.cpp).
- name: jan-v3-5-4b-q4-k-m
  backend: llama-cpp
  parameters:
    model: llm/Jan-v3_5-4B-Q4_K_M/model.gguf
  context_size: 32768
  cache_type_k: q8_0
  cache_type_v: q8_0
  gpu_layers: 99
  flash_attention: true
  template:
    use_tokenizer_template: true

- name: jan-code-4b-q4-k-m
  backend: llama-cpp
  parameters:
    model: llm/Jan-code-4b-Q4_K_M/model.gguf
  context_size: 32768
  cache_type_k: q8_0
  cache_type_v: q8_0
  gpu_layers: 99
  flash_attention: true
  template:
    use_tokenizer_template: true

- name: ornith-1-5-9b-q4-k-m
  backend: llama-cpp
  parameters:
    model: llm/Ornith-1_5-9B-Q4_K_M/model.gguf
  mmproj: llm/Ornith-1_5-9B-Q4_K_M/mmproj.gguf
  context_size: 32768
  cache_type_k: q8_0
  cache_type_v: q8_0
  gpu_layers: 18   # 9B não cabe inteiro em 6 GB; o LocalAI não ajusta sozinho
  flash_attention: true
  template:
    use_tokenizer_template: true

- name: qwen3-5-9b-deepseek-v4-flash-q4-k-m
  backend: llama-cpp
  parameters:
    model: llm/Qwen3_5-9B-DeepSeek-V4-Flash-Q4_K_M/model.gguf
  mmproj: llm/Qwen3_5-9B-DeepSeek-V4-Flash-Q4_K_M/mmproj.gguf
  context_size: 32768
  cache_type_k: q8_0
  cache_type_v: q8_0
  gpu_layers: 14   # 9B não cabe inteiro em 6 GB; o LocalAI não ajusta sozinho
  flash_attention: true
  template:
    use_tokenizer_template: true

