# Imagem (mesmos parâmetros do stoa-walls-ai: 4 passos, cfg 1.0, euler_a)
- name: sdxl-turbo
  backend: stablediffusion-ggml
  parameters:
    model: sd_xl_turbo_1.0_fp16.safetensors
  step: 4
  cfg_scale: 1.0
  options:
    - "sampler:euler_a"

- name: sdxl-lightning
  backend: stablediffusion-ggml
  parameters:
    model: sdxl_lightning_4step.safetensors
  step: 4
  cfg_scale: 1.0
  options:
    - "sampler:euler_a"
