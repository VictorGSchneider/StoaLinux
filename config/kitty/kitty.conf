# ── Window ──
background_opacity         0.92
window_padding_width       12
hide_window_decorations    yes
confirm_os_window_close    0

# ── Font ──
font_family                JetBrains Mono
bold_font                  JetBrains Mono Bold
italic_font                JetBrains Mono Italic
bold_italic_font           JetBrains Mono Bold Italic
font_size                  11.0

# ── Cursor ──
cursor_shape               block
cursor_blink_interval      0.75
cursor                     #c49a5c
cursor_text_color          #211e19

# ── Scrollback ──
scrollback_lines           10000

# ── Mouse ──
url_color                  #5a7a8a
url_style                  curly

# ── Selection ──
selection_foreground       #211e19
selection_background       #c4b08a

# ── Paleta Estoica ──
foreground                 #d4cfc4
background                 #211e19

# Terminal ANSI — Normal
color0                     #1a1714
color1                     #b36b5a
color2                     #8a9a6c
color3                     #c49a5c
color4                     #5a7a8a
color5                     #946a7a
color6                     #6a8a7a
color7                     #d4cfc4

# Terminal ANSI — Bright
color8                     #4a4540
color9                     #c4806e
color10                    #9aaa7c
color11                    #d4a84b
color12                    #6a8a9a
color13                    #a47a8a
color14                    #7a9a8a
color15                    #e4dfd4

# ── Tab bar ──
tab_bar_style              powerline
tab_powerline_style        slanted
active_tab_foreground      #211e19
active_tab_background      #c49a5c
active_tab_font_style      bold
inactive_tab_foreground    #a89f91
inactive_tab_background    #1a1714
inactive_tab_font_style    normal

# ── Bell ──
enable_audio_bell          no
visual_bell_duration       0
