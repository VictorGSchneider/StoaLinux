[Settings]
gtk-theme-name = Adwaita-dark
gtk-icon-theme-name = Colloid-dark
gtk-cursor-theme-name = Colloid-cursors
gtk-cursor-theme-size = 24
gtk-font-name = EB Garamond 11
# Dark mode for GTK4 / libadwaita is driven by
# org.gnome.desktop.interface color-scheme = 'prefer-dark', set by
# theme/pacman-hooks/stoa-theme-enforce. The legacy
# gtk-application-prefer-dark-theme key is unsupported under libadwaita
# (emits an Adwaita-WARNING on every app launch) and was removed.
