#  ╔══════════════════════════════════════════════════════════════╗
#  ║  STOA LINUX — Text prediction (Noctalia v5 plugin)             ║
#  ║  "Choose your words with care." — Epictetus                    ║
#  ╚══════════════════════════════════════════════════════════════╝
#
#  Owns the prediction input method (scripts/stoa-predict.py). The
#  daemon is a Wayland input method (input-method-v2, like fcitx): it
#  draws its own popup next to the text cursor, takes ↑/↓/←/→/Enter while
#  the popup is up and types the chosen word through the text-input
#  protocol, so the shell only has to start it, stop it and report.
#
#  This plugin used to draw the suggestions itself, in a panel at the
#  bottom of the screen fed by an evdev daemon. A shell panel cannot be
#  placed at another app's text cursor nor take the arrow keys without
#  stealing focus, which is why the popup moved into the input method.
#
#  Super+Shift+S runs `stoa-predict toggle`, which sends `toggle` to the
#  service over IPC:  noctalia msg plugin stoa/predict:service all toggle

id          = "stoa/predict"
name        = "Stoa Text Prediction"
version     = "2.0.0"
author      = "stoa"
icon        = "keyboard"
description = "Word and emoji suggestions next to the text cursor while you type"
tags        = ["input", "typing"]
dependencies = ["python-pywayland", "python-cairo", "python-gobject"]

# The service only needs runStream, runAsync, notify and json, all older
# than 9; 9 matches the other Stoa plugins.
plugin_api = 9

[[service]]
id    = "service"
entry = "service.luau"
