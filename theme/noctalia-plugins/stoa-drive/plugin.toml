#  ╔══════════════════════════════════════════════════════════════╗
#  ║  STOA LINUX — Drive pill (Noctalia v5 plugin)                ║
#  ║  rclone remote mount state in the bar.                        ║
#  ╚══════════════════════════════════════════════════════════════╝
#
#  Port of the v4 QML plugin that lived at theme/noctalia-plugins/
#  stoa-drive-pill. v5 plugins are Luau with this manifest; the QML entry
#  points (Main.qml / BarWidget.qml / Panel.qml) have no equivalent, so
#  the widget was rewritten rather than translated.
#
#  The data source is unchanged: scripts/stoa-drive-status still emits the
#  same JSON, so the shell side did not have to move.

id          = "stoa/drive"
name        = "Stoa Drive"
version     = "1.0.0"
author      = "stoa"
description = "rclone remote mount state, with cache usage in the tooltip"

# Oldest plugin API level this needs. Noctalia v5 accepts 3..28, and
# nothing here uses anything past the level-3 surface: runAsync,
# json.decode, getSetting, setUpdateInterval and barWidget.*.
plugin_api = 3

[[widget]]
id    = "pill"
entry = "widget.luau"

# Settings are an ARRAY of tables named `setting` (singular), each with an
# explicit `key` — not [settings.<name>] sub-tables. `label_key` is
# mandatory and is a translation key resolved against translations/en.json,
# so both live or die together.
[[setting]]
key       = "poll_seconds"
type      = "int"
default   = 30
min       = 5
max       = 600
label_key = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"

[[setting]]
key       = "show_badge"
type      = "bool"
default   = true
label_key = "settings.show_badge.label"
description_key = "settings.show_badge.description"
