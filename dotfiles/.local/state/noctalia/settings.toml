config_version = 15

[backdrop]
enabled = true

[bar.default]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "stoa/drive:pill",
    "sysmon",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
start = [ "launcher", "workspaces", "taskbar", "stoa/health:pill" ]

[brightness]
sync_all_monitors = true

[calendar]
dedupe_events = true
enabled = true

[control_center.calendar]
show_week_numbers = true

[dock]
enabled = true
layer = "overlay"
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 4800
temperature_night = 2800

[plugins]
enabled = [ "stoa/drive", "stoa/health" ]

[shell]
external_ip_enabled = true
password_style = "random"
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = true
    save_to_file = false
    show_cursor = true

    [shell.session]
    grid = true
    show_shortcuts = false

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"