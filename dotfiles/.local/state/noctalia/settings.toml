config_version = 15

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "on_primary"
capsule_border_width = 0.0
capsule_fill = "on_primary"
capsule_foreground = "primary"
capsule_opacity = 0.65999998524785042
center = [ "clock", "taskbar", "launcher", "workspaces", "widget" ]
contact_shadow = true
end = [ "tray", "notifications", "clipboard", "stoa/drive:pill", "group:g1", "session" ]
font_scale = 1.0499999839812517
layer = "overlay"
margin_ends = 15
padding = 0
scale = 1.0500000081956387
start = [ "sysmon", "weather", "stoa/health:pill", "media" ]
thickness = 40

    [bar.default.dead_zone.actions]
    middle = "volume-mute"
    scroll_down = "volume-down 1"
    scroll_up = "volume-up 1"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_primary"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    foreground = "primary"
    id = "g1"
    members = [ "network", "bluetooth", "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

[brightness]
sync_all_monitors = true

[calendar]
dedupe_events = true
enabled = true

[control_center]
sidebar_section = "none"
width = 800

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = [ "stoa_memento", "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 192.0
    box_width = 528.0
    cx = 328.0
    cy = 252.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = true
        background_color = "on_primary"
        background_opacity = 0.29999999999999999
        background_padding = 7
        background_radius = 15
        clock_style = "digital"
        color = "primary"
        format = "{:%H:%M:%S}"

    [desktop_widgets.widget.stoa_memento]
    box_height = 432.0
    box_width = 464.0
    cx = 1624.0
    cy = 308.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "stoa/memento:desktop"

[dock]
background_opacity = 0.0
enabled = true
layer = "overlay"
pinned = [ "brave-browser" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 4800
temperature_night = 2800

[plugin_settings."alexander/screen-toolkit"]
panel-legacy_layer = "overlay"
panel-legacy_open_near_click = true
panel-legacy_position = "auto"
panel-mode = "legacy"
panel_open_near_click = true
panel_placement = "attached"
record-copy-to-clipboard = true
result_layer = "overlay"
search-engine-url = "https://search.brave.com/search?q="
selected-ocr-lang = "eng+pt-br"

[plugin_settings."stoa/drive"]
manage_open_near_click = true

[plugin_settings."stoa/health"]
manage_open_near_click = true

[plugin_settings."stoa/predict"]
popup_placement = "attached"

[plugins]
enabled = [ "stoa/drive", "stoa/health", "alexander/screen-toolkit", "stoa/memento", "stoa/predict" ]

[shell]
external_ip_enabled = true
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
password_style = "random"
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    default_view = "pinned"
    pinned = [
        "brave-browser",
        "steam",
        "eu.betterbird.Betterbird",
        "onlyoffice-desktopeditors",
        "obsidian",
        "calibre-gui",
        "kitty",
        "thunar",
        "enpass",
        "stoa-snapshots",
        "dfm",
        "dev.zed.Zed",
        "qalculate-gtk"
    ]
    search_position = "top"
    show_app_actions = true
    show_session_button = false
    show_settings_button = false

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = true
    save_to_file = false
    show_cursor = true

    [shell.session]
    grid = true
    show_shortcuts = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "Stoa"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
fill_mode = "fit"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/zeno/.config/stoa/wallpapers/parchment.png"

    [wallpaper.last]
    path = "/home/zeno/.config/stoa/wallpapers/parchment.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/zeno/.config/stoa/wallpapers/parchment.png"

[widget.launcher]
capsule_foreground = "primary"
glyph = "columns"

[widget.lock_keys]
hide_when_off = true
show_scroll_lock = true

[widget.media]
rotate_album_art = true
title_scroll = "always"

[widget.tray]
match_adjacent_spacing = true

[widget.weather]
max_length = 180

[widget.widget]
type = "alexander/screen-toolkit:widget"