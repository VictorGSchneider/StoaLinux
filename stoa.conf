# ── Keybinds in the bar ──
# Show main keybinds in the top bar.
# true = visible | false = hidden
# Quick toggle: Super+/
STOA_SHOW_KEYBINDS=true

# ── Bar engine ──
# Which bar to launch via stoa-bar (called from Hyprland exec-once):
#   quickshell  → ~/.config/quickshell (QML, default)
#   waybar      → ~/.config/waybar (legacy GTK fallback)
# Unset = auto-pick quickshell if installed, else waybar.
STOA_BAR=quickshell
