# ╔══════════════════════════════════════════════════════════════╗
# ║  STOA LINUX — CI                                             ║
# ║  "Only what serves, stays."                                  ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Every check lives in tests/run.sh, not here. This file only decides
# what runs in parallel and which tool each job needs, so that
# `bash tests/run.sh` on your machine and CI can never drift apart.
#
# The jobs are split by what breaks, not by tooling: a shellcheck
# finding should not hide a broken plugin.toml, and a failing invariant
# should not wait behind an apt install. Each reports on its own.
#
#   shell  the ~60 scripts we ship, including the extensionless ones
#   data   the formats where a typo fails silently instead of loudly
#   stoa   the repo-specific invariants under tests/
#
# --strict turns "tool missing, skipped" into a failure: locally a skip
# is a convenience, in CI it would be a check quietly not running.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; there is nothing to learn from
# finishing a run against a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell (syntax + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          command -v shellcheck >/dev/null && exit 0
          sudo apt-get update && sudo apt-get install -y shellcheck

      - run: bash tests/run.sh shell --strict

  data:
    name: data (json / toml / lua / python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # luac5.4 parses config/hypr/hyprland.lua and the Noctalia *.luau
      # plugins; ruff catches the runtime-only Python faults py_compile
      # cannot see (undefined names, a dict key written twice).
      - name: Install lua + ruff
        run: |
          command -v luac5.4 >/dev/null || {
            sudo apt-get update && sudo apt-get install -y lua5.4
          }
          command -v ruff >/dev/null || pipx install ruff || pip install --user ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: bash tests/run.sh data --strict

  stoa:
    name: stoa (invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing to install: these are plain python3 and bash, on purpose,
      # so they stay runnable on the machine StoaLinux is installed on.
      - run: bash tests/run.sh stoa --strict
